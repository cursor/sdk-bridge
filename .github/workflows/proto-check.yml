# Lints and builds the synced sdk.v1 contract so a bad sync or PR is caught.
#
# proto/ is generated by Cursor's internal release automation, which commits
# directly to main and pushes vX.Y.Z tags (see docs/versioning.md). This
# workflow is checks-only: it must never push, tag, or otherwise write.
# It skips gracefully while proto/ does not exist yet (before the first sync).
name: proto-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for synced protos
        id: protos
        run: |
          if [ -d proto/sdk/v1 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "proto/sdk/v1 not present yet (first release sync has not run); skipping buf checks." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: bufbuild/buf-setup-action@v1
        if: steps.protos.outputs.present == 'true'
        with:
          github_token: ${{ github.token }}

      - name: buf build
        if: steps.protos.outputs.present == 'true'
        run: buf build

      - name: buf lint
        if: steps.protos.outputs.present == 'true'
        run: buf lint

      - name: Validate proto/manifest.json
        if: steps.protos.outputs.present == 'true'
        run: |
          test -f proto/manifest.json || { echo "proto/manifest.json is missing"; exit 1; }
          jq -e '.protocol == "sdk.v1" and (.sdkVersion | type == "string" and length > 0) and (.sourceCommit | type == "string" and length > 0)' \
            proto/manifest.json > /dev/null \
            || { echo "proto/manifest.json must have protocol==\"sdk.v1\" and non-empty sdkVersion/sourceCommit"; exit 1; }
