# Buf configuration for the synced sdk.v1 contract.
#
# proto/ is generated by Cursor's internal release automation (see
# docs/versioning.md); this file is human-owned and configures how CI lints
# and builds it. The lint rule set matches the source repository's config:
# the RPC_REQUEST_RESPONSE_UNIQUE / RPC_*_STANDARD_NAME rules are intentionally
# not enabled because streaming RPCs share the RunStreamMessage envelope.
version: v2
modules:
  - path: proto
lint:
  use:
    - BASIC
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - FILE_LOWER_SNAKE_CASE
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX
breaking:
  use:
    - WIRE_JSON
